seed: 41
num_train_epochs: 3          # rescue attempt (only if acquisition fails): 4, nothing else changes
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
max_seq_length: 512
completion_only_loss: true   # unit-tested: prompt tokens must be label -100
bf16: true
# Operational (added 2026-09-02, approved). No scientific parameter is affected.
save_strategy: steps
save_steps: 100
save_total_limit: 2
